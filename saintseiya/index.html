<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>BoomArt · Saint Seiya</title>
    <!-- Enlace corto de campana (pedido de Adrian, 2026-09-29, video de
         octubre para Instagram/Facebook): boomart.pe/saintseiya redirige al
         catalogo principal ya filtrado en Saint Seiya, para que se vea el
         banner del cupon de bienvenida arriba de todo y debajo solo esas
         piezas. Sin indexar (no es contenido propio, es solo un redirect).
         SIN #catalogo en la URL destino: un ancla en el enlace hace que el
         navegador salte solo a esa seccion apenas carga, tapando el banner
         que queda mas arriba (Adrian lo detecto en pantalla, 2026-09-29). -->
    <meta name="robots" content="noindex, follow">
    <!-- Respaldo sin JS: espera 3 s para que el script de abajo (que conserva las
         marcas del enlace, p. ej. ?utm_source=... o ?src=..., y el fbclid de Meta)
         redirija primero. Con 0 s el refresh ganaba y borraba esas marcas. -->
    <meta http-equiv="refresh" content="3; url=https://boomart.pe/?categoria=saint-seiya">
    <link rel="canonical" href="https://boomart.pe/categoria/saint-seiya/">
    <!-- Vista previa al compartir el enlace (WhatsApp, Facebook, Instagram, X): los
         rastreadores NO ejecutan el JS ni siguen el refresh de arriba, leen solo
         estas etiquetas de ESTA pagina. Sin ellas salia solo el titulo y el dominio
         (Adrian lo vio en WhatsApp, 2026-10-07). La imagen debe ser JPG (WhatsApp y
         Facebook no muestran webp/avif) y liviana (< 300 KB). Sin precios ni envio. -->
    <meta name="description" content="Los 12 templos del Zodiaco con sus cajas de Pandora, altares, el busto de Atena y más piezas de Saint Seiya impresas en 3D. Mira el catálogo en BoomArt.">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="BoomArt">
    <meta property="og:title" content="Saint Seiya · Templos del Zodiaco impresos en 3D | BoomArt">
    <meta property="og:description" content="Los 12 templos del Zodiaco con sus cajas de Pandora, altares, el busto de Atena y más piezas de Saint Seiya impresas en 3D. Mira el catálogo en BoomArt.">
    <meta property="og:url" content="https://boomart.pe/saintseiya/">
    <meta property="og:image" content="https://boomart.pe/assets/og-saintseiya.jpg">
    <meta property="og:image:secure_url" content="https://boomart.pe/assets/og-saintseiya.jpg">
    <meta property="og:image:type" content="image/jpeg">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="BoomArt · Saint Seiya: los 12 templos del Zodiaco con sus cajas de Pandora, impresos en 3D">
    <meta property="og:locale" content="es_PE">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Saint Seiya · Templos del Zodiaco impresos en 3D | BoomArt">
    <meta name="twitter:description" content="Los 12 templos del Zodiaco con sus cajas de Pandora, altares, el busto de Atena y más piezas de Saint Seiya impresas en 3D.">
    <meta name="twitter:image" content="https://boomart.pe/assets/og-saintseiya.jpg">
    <meta name="twitter:image:alt" content="BoomArt · Saint Seiya: los 12 templos del Zodiaco con sus cajas de Pandora, impresos en 3D">
    <script>
      (function () {
        var q = new URLSearchParams(location.search);
        q.set("categoria", "saint-seiya");
        location.replace("https://boomart.pe/?" + q.toString() + location.hash);
      })();
    </script>
  </head>
  <body>
    <p>Redirigiendo a <a href="https://boomart.pe/?categoria=saint-seiya">el catálogo de Saint Seiya en BoomArt</a>…</p>
  </body>
</html>
