name: Generar catalogo para IA y buscadores

on:
  push:
    branches: [main]
    paths:
      - "data/products.json"
      - "scripts/build-ai-catalog.mjs"
      - ".github/workflows/build-ai-catalog.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Regenerar catalogo y feeds
        run: node scripts/build-ai-catalog.mjs

      - name: Publicar los archivos regenerados (si hubo cambios)
        id: commit
        run: |
          FILES="catalogo.html catalogo.json llms.txt llms-full.txt feed-google.xml feed-meta.csv"
          if [ -n "$(git status --porcelain $FILES)" ]; then
            git config user.name "boomart-bot"
            git config user.email "boomart.3d@gmail.com"
            git add $FILES
            git commit -m "Regenera catalogo y feeds para IA y buscadores [skip ci]"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "El catalogo generado ya estaba al dia."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Avisar a los buscadores (IndexNow - Bing, Yandex, etc.)
        if: steps.commit.outputs.changed == 'true'
        run: |
          curl -sS -X POST "https://api.indexnow.org/indexnow" \
            -H "Content-Type: application/json; charset=utf-8" \
            -d '{
              "host": "boomart.pe",
              "key": "20f2df66390ae288bb04a34ec5418613",
              "keyLocation": "https://boomart.pe/20f2df66390ae288bb04a34ec5418613.txt",
              "urlList": [
                "https://boomart.pe/",
                "https://boomart.pe/catalogo.html",
                "https://boomart.pe/catalogo.json",
                "https://boomart.pe/llms.txt",
                "https://boomart.pe/llms-full.txt",
                "https://boomart.pe/feed-google.xml",
                "https://boomart.pe/feed-meta.csv"
              ]
            }' || echo "IndexNow no respondio, se reintentara en el proximo cambio."
