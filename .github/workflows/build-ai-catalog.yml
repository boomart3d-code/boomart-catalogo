name: Generar catalogo para IA y buscadores

on:
  push:
    branches: [main]
    paths:
      - "data/products.json"
      - "data/reviews.json"
      - "assets/products/**"
      - "assets/hero/**"
      - "scripts/build-responsive-images.mjs"
      - "scripts/responsive-html.mjs"
      - "src/responsive-images.js"
      - "scripts/build-ai-catalog.mjs"
      - "scripts/video-upload-date.mjs"
      - "scripts/video-upload-date.test.mjs"
      - "scripts/audit-seo.mjs"
      - "scripts/indexnow.mjs"
      - "scripts/indexnow.test.mjs"
      - ".github/scripts/build-og-images.mjs"
      - ".github/workflows/build-ai-catalog.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar sharp (para las miniaturas de compartir)
        run: npm install --no-save sharp

      - name: Generar miniaturas livianas para WhatsApp y redes
        run: node .github/scripts/build-og-images.mjs

      - name: Validar fechas de videos
        run: node --test scripts/video-upload-date.test.mjs

      - name: Generar fotos por tamaño para celulares y miniaturas
        run: node scripts/build-responsive-images.mjs

      - name: Validar seleccion de imagenes
        run: node --test scripts/responsive-images.test.mjs

      - name: Regenerar catalogo y feeds
        run: node scripts/build-ai-catalog.mjs

      - name: Validar enlaces rastreables, fichas y feed
        run: |
          node --test scripts/indexnow.test.mjs
          node scripts/audit-seo.mjs

      - name: Publicar los archivos regenerados (si hubo cambios)
        id: commit
        run: |
          FILES="catalogo.html catalogo.json llms.txt llms-full.txt feed-google.xml feed-meta.csv index.html sitemap.xml producto categoria Halloween saintseiya assets/og assets/responsive src/image-sources.js"
          if [ -n "$(git status --porcelain $FILES)" ]; then
            git config user.name "boomart-bot"
            git config user.email "boomart.3d@gmail.com"
            git add $FILES
            git commit -m "Regenera catalogo, paginas de producto y categoria y feeds para IA y buscadores [skip ci]"
            # Otro robot (optimizar fotos) puede haber guardado justo antes:
            # ponerse al dia y reintentar en vez de fallar.
            # --autostash: el build deja otros archivos modificados (p. ej. paginas de
            # campana) que no se publican aqui; sin esto el pull fallaba en silencio.
            ok=0
            for i in 1 2 3; do git pull --rebase --autostash && git push && { ok=1; break; }; sleep 5; done
            [ "$ok" = 1 ] || { echo "No se pudo publicar tras 3 intentos"; exit 1; }
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "El catalogo generado ya estaba al dia."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      # IndexNow se ejecuta despues de Pages en indexnow.yml, sobre URLs publicadas.
