name: Renovar feed de ChatGPT Ads (diario)

# Segun el Centro de Ayuda de OpenAI Ads los productos importados CADUCAN A LAS 2 SEMANAS si no se
# renuevan; por eso recomiendan importar por URL alojada o por SFTP automatizado. BoomArt usa la URL
# alojada https://boomart.pe/feed-openai.csv (alternativa: feed-openai.txt): OpenAI la vuelve a leer por su
# cuenta, asi que lo que este flujo garantiza es que esa URL este SIEMPRE disponible, valida y al dia.
#   1. prueba el feed (duplicados, incompletos, desactualizados, plazos, disponibilidad, enlaces rotos);
#   2. comprueba el sitio PUBLICADO como lo ven OAI-AdsBot y OAI-SearchBot y como lo lee una URL alojada;
#   3. comprueba en OpenAI que el catalogo se PROCESO bien y sigue vigente (solo si guardaste la clave
#      de API de Ads como secreto; sin ella se omite);
#   4. ALTERNATIVA: sube feed-openai.csv por SFTP, SOLO si guardaste las credenciales como secretos.
# Si algo falla, la ejecucion queda en rojo y GitHub avisa por correo. No crea campanas ni gasta.
# Guia: docs/CHATGPT_ADS.md

on:
  schedule:
    # Todos los dias a las 06:23 hora de Lima (11:23 UTC)
    - cron: "23 11 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: feed-openai-diario
  cancel-in-progress: false

jobs:
  renovar:
    runs-on: ubuntu-latest
    env:
      # Secretos del repositorio (Settings > Secrets and variables > Actions). Vacios = no se sube nada.
      SFTP_HOST: ${{ secrets.OPENAI_ADS_SFTP_HOST }}
      SFTP_USER: ${{ secrets.OPENAI_ADS_SFTP_USER }}
      SFTP_KEY: ${{ secrets.OPENAI_ADS_SFTP_KEY }}
      SFTP_PORT: ${{ secrets.OPENAI_ADS_SFTP_PORT }}
      # Clave de API de Ads (solo lectura en este flujo) y feed a vigilar. Vacias = se omite el control.
      OPENAI_ADS_API_KEY: ${{ secrets.OPENAI_ADS_API_KEY }}
      OPENAI_ADS_FEED_ID: ${{ secrets.OPENAI_ADS_FEED_ID }}
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Probar el feed (duplicados, incompletos, desactualizados, plazos, disponibilidad, enlaces rotos)
        run: |
          node --test scripts/openai-feed.test.mjs scripts/openai-hosted.test.mjs scripts/plazos.test.mjs scripts/ads-disponibilidad.test.mjs
          node scripts/validate-feeds.mjs

      - name: Comprobar el sitio publicado, la URL alojada y el acceso de OAI-AdsBot y OAI-SearchBot
        run: node scripts/check-openai-feed-access.mjs --base https://boomart.pe

      - name: Comprobar en OpenAI que el catalogo se proceso bien (solo con clave de API de Ads)
        run: node scripts/check-openai-feed-processing.mjs

      - name: Subir el feed a OpenAI por SFTP (alternativa a la URL alojada)
        if: env.SFTP_HOST != '' && env.SFTP_USER != '' && env.SFTP_KEY != ''
        run: |
          set -euo pipefail
          KEY="$(mktemp)"
          BATCH="$(mktemp)"
          trap 'rm -f "$KEY" "$BATCH"' EXIT
          printf '%s\n' "$SFTP_KEY" > "$KEY"
          chmod 600 "$KEY"
          # Archivo con nombre estable, directamente en la raiz del SFTP (guia de feeds de OpenAI Ads)
          printf 'put feed-openai.csv feed-openai.csv\nbye\n' > "$BATCH"
          sftp -b "$BATCH" -i "$KEY" -P "${SFTP_PORT:-22}" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new \
            "$SFTP_USER@$SFTP_HOST"
          FILAS="$(($(wc -l < feed-openai.csv) - 1))"
          echo "::notice::Feed subido a OpenAI: $FILAS filas ($(date -u +%F))"
          echo "Feed subido a OpenAI por SFTP: $FILAS filas, $(date -u +%FT%TZ)" >> "$GITHUB_STEP_SUMMARY"

      - name: Aviso si no hay credenciales SFTP
        if: env.SFTP_HOST == '' || env.SFTP_USER == '' || env.SFTP_KEY == ''
        run: |
          echo "::notice::El feed esta probado y publicado en https://boomart.pe/feed-openai.csv. No se sube por SFTP (faltan OPENAI_ADS_SFTP_HOST, OPENAI_ADS_SFTP_USER y OPENAI_ADS_SFTP_KEY): es normal si Ads Manager lo importa por URL alojada (ver docs/CHATGPT_ADS.md)."
          echo "Feed probado y publicado (URL alojada). Sin credenciales SFTP: no se sube por SFTP." >> "$GITHUB_STEP_SUMMARY"
