name: Optimizar fotos de productos

on:
  push:
    branches: [main]
    paths:
      - "assets/products/**"

permissions:
  contents: write

jobs:
  optimize:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar sharp (herramienta de compresion de imagenes)
        run: npm install --no-save sharp

      - name: Optimizar fotos nuevas o modificadas
        run: node .github/scripts/optimize-images.mjs

      - name: Publicar las fotos optimizadas (si hubo cambios)
        run: |
          if [ -n "$(git status --porcelain assets/products)" ]; then
            git config user.name "boomart-bot"
            git config user.email "boomart.3d@gmail.com"
            git add assets/products
            git commit -m "Optimiza automaticamente fotos de productos [skip ci]"
            # Otro robot (catalogo) puede haber guardado justo antes:
            # ponerse al dia y reintentar en vez de fallar.
            # --autostash: el build deja otros archivos modificados (p. ej. paginas de
            # campana) que no se publican aqui; sin esto el pull fallaba en silencio.
            ok=0
            for i in 1 2 3; do git pull --rebase --autostash && git push && { ok=1; break; }; sleep 5; done
            [ "$ok" = 1 ] || { echo "No se pudo publicar tras 3 intentos"; exit 1; }
          else
            echo "Ninguna foto necesitaba optimizarse."
          fi
