name: Avisar URLs publicadas a Bing e IndexNow
on:
  page_build:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: indexnow-publicado
  cancel-in-progress: false
jobs:
  notify:
    if: github.event_name == 'workflow_dispatch' || github.event.build.status == 'built'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.build.commit || github.sha }}
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Avisar solo fichas y paginas cambiadas que ya estan publicadas
        run: node scripts/indexnow.mjs --output indexnow-result.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: indexnow-recepcion
          path: indexnow-result.json
