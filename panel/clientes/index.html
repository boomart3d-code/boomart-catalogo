<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Registros de clientes · BoomArt</title><link rel="icon" type="image/svg+xml" href="../../assets/boomart-mark.svg?v=7"><link rel="alternate icon" type="image/png" sizes="32x32" href="../../assets/boomart-mark-32.png"><link rel="apple-touch-icon" sizes="180x180" href="app/ventas-180.png"><link rel="manifest" href="app/manifest.webmanifest"><meta name="theme-color" content="#111111"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="BA Ventas"><link rel="stylesheet" href="styles.css?v=5"></head><body>
<header><b>BOOM<span>ART</span></b><div><strong>Registros de clientes</strong><small>Bandeja privada</small></div><button id="logout" hidden>Cerrar sesión</button></header><main>
<section id="loading" class="box">Cargando…</section><section id="login" class="box login" hidden><span>ACCESO PRIVADO</span><h1>Entra con tu correo</h1><p>Te enviaremos un enlace mágico. No necesitas contraseña.</p><form id="loginForm"><input id="email" type="email" value="boomart.3d@gmail.com" autocomplete="email" required><button>Enviarme el enlace de acceso</button></form><p id="loginMsg"></p></section>
<section id="denied" class="box login" hidden><h1>Sin acceso</h1><p>Esta cuenta no está autorizada.</p></section>
<section id="portal" hidden><div class="summary"><div><b id="total">0</b><small>Registros visibles</small></div><div><b id="drafts">0</b><small>Borradores</small></div><div><b id="pending">0</b><small>Pendientes</small></div><div><b id="imported">0</b><small>Importados</small></div></div><div class="filters"><input id="query" placeholder="Nombre, teléfono, DNI, código…"><select id="status"><option value="">Todos los estados</option><option value="draft">Borradores</option><option value="complete">Completos</option><option value="whatsapp_opened">WhatsApp abierto</option><option value="imported">Importados</option><option value="expired">Vencidos</option><option value="revoked">Revocados</option></select><button id="refresh">Actualizar</button></div><p id="state"></p><div id="list"></div></section>
<p id="paymentsConnection" role="status" aria-live="polite"></p>

</main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3/dist/umd/supabase.js" integrity="sha384-BWcjm9OdFth9TbhCxZPdm+gAOUMAzQy9nmTs12ioXdCcbVnJaPMn+fMUoQCLt60R" crossorigin="anonymous"></script><script src="../../src/supabase-config.js?v=1"></script><script type="module" src="payments.js?v=2"></script><script src="ventas.js?v=3"></script><script src="app.js?v=3"></script></body></html>
